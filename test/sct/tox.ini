[tox]
minversion = 2.5
skipsdist = True
envlist = test-hello

[pytest]
addopts = -p no:logging

[testenv:test-hello]
basepython = python3
passenv = *
allowlist_externals = bash
deps =
    -r{toxinidir}/requirements.txt
commands_pre =
    bash {toxinidir}/tools/prepare_env.sh
commands =
    py.test --junit-xml={toxinidir}/logs/sct-junit.xml {posargs}
